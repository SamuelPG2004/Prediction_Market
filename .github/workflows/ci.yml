# CI mínimo: tipos + tests en cada push. Con dos sesiones empujando a la
# misma rama, esto es lo que impide que un commit roto pase desapercibido.
# Los pushes a ramas con PR aparecen como checks del PR; no hace falta
# duplicar la ejecución con un disparador pull_request.
name: CI

on:
  push:

jobs:
  verificar:
    name: Tipos y tests
    runs-on: ubuntu-latest
    steps:
      - name: Código
        uses: actions/checkout@v4

      # Espeja el entorno de desarrollo real (node 20 + npm 11): el npm 10
      # que trae node 22 valida los peers del lock con otras reglas y npm ci
      # falla con "Missing: typescript@5.9.3" que localmente no existe.
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm 11 (el que generó el lock)
        run: npm install -g npm@11

      - name: Dependencias
        run: npm ci

      - name: Tipos (tsc --noEmit)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test
